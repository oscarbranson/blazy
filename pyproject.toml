[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blazy"
dynamic = ["version"]
description = "Tools for solution speciation calculations with PHREEQC."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Oscar Branson", email = "ob266@cam.ac.uk" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3"
]
dependencies = [
    "numpy>=1.21.5",
    "pymyami==2.1.0",
    "uncertainties",
    "phreeqpy"
]

[project.urls]
Homepage  = "https://github.com/oscarbranson/blazy"
